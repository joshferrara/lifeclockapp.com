<!DOCTYPE html>
<html lang="en-us">

{% include head.html %}

<body>
    <div class="site-wrapper">
        {% include header.html %}

        <section class="hero">
            <div class="hero-inner">
                <div class="hero-content">
                    <h1 class="hero-title">What time is it<br>in your life?</h1>
                    <p class="hero-subtitle">{{ site.app_description }}</p>
                    <div class="hero-cta">
                        <a class="appStoreLink" href="{{ site.appstore_link }}">
                            <img class="appStore" src="assets/appstore.svg" alt="Download on the App Store">
                        </a>
                    </div>
                </div>
                <div class="hero-phones">
                    <div class="phone-mockup phone-left">
                        <div class="phone-frame">
                            <img src="assets/screenshot/list-view.png" alt="Life Clock list view">
                        </div>
                    </div>
                    <div class="phone-mockup phone-right">
                        <div class="phone-frame">
                            <img src="assets/screenshot/detail-view.png" alt="Life Clock detail view">
                        </div>
                    </div>
                </div>
            </div>
        </section>

        {% include features.html %}
        {% include footer.html %}
    </div>

    {% include appstoreimages.html %}
</body>
</html>
