<section class="features">

    {% for feature in site.features %}

    {% if feature.title %}
    <div class="feature">
        <div class="featureIcon">
            <i class="iconTop fas fa-{{ feature.fontawesome_icon_name }}"></i>
        </div>
        <div class="featureText">
            <h3>{{ feature.title }}</h3>
            <p>{{ feature.description }}</p>
        </div>
    </div>
    {% endif %}

    {% endfor %}

</section>
